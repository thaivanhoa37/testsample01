<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Create a new account on Reanty - Modern Real Estate Platform. Join today to explore homes, apartments, and commercial properties.">
  <title>Sign Up - Reanty Real Estate</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Main Vanilla CSS File (Đường dẫn tương đối) -->
  <link rel="stylesheet" href="../css/style.css">

</head>

<body>

  <!-- ========================================================================= -->
  <!-- 1. HEADER COMPONENT (TOP CONTACT BAR & MAIN NAVBAR)                       -->
  <!-- ========================================================================= -->
  <div id="header-placeholder" data-include="../components/header.html"></div>


  <!-- ========================================================================= -->
  <!-- MAIN AUTH SECTION: REGISTER FORM                                         -->
  <!-- ========================================================================= -->
  <main class="auth-page">
    <div class="container">

      <!-- Breadcrumb Navigation -->
      <nav class="auth-breadcrumb" aria-label="Breadcrumb">
        <a href="../index.html">Home</a>
        <span class="auth-breadcrumb__separator">/</span>
        <span class="auth-breadcrumb__current">Sign Up</span>
      </nav>

      <!-- Auth Card Container -->
      <div class="auth-card">

        <!-- Card Header -->
        <div class="auth-header">
          <div class="auth-header__badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <line x1="20" y1="8" x2="20" y2="14"></line>
              <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
            <span>Get Started</span>
          </div>
          <h1 class="auth-header__title">Create an Account</h1>
          <p class="auth-header__subtitle">Join thousands of people finding their dream home</p>
        </div>

        <!-- Alert Notification -->
        <div class="auth-alert auth-alert--success" id="registerSuccessAlert">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          <span>Đăng ký tài khoản thành công! Đang chuyển hướng...</span>
        </div>

        <div class="auth-alert auth-alert--error" id="registerErrorAlert">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
          </svg>
          <span id="registerErrorMessage">Mật khẩu xác nhận không khớp.</span>
        </div>

        <!-- ========================================================================= -->
        <!-- FORM ĐĂNG KÝ (HỖ TRỢ LINK ACTION DATA SERVER & TEST SERVER)                -->
        <!-- ========================================================================= -->
        <form class="auth-form" id="registerForm" action="#" method="POST"
          data-test-server-url="https://test-server.example.com/api/v1/auth/register"
          data-data-server-url="https://api.reanty.com/api/v1/auth/register">

          <!-- Full Name Field -->
          <div class="form-group">
            <label for="regName" class="form-label">
              <span>Full Name</span>
              <span class="required">*</span>
            </label>
            <div class="form-input-wrapper">
              <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input type="text" id="regName" name="name" class="form-input" placeholder="John Doe" required
                autocomplete="name">
            </div>
          </div>

          <!-- Email Address Field -->
          <div class="form-group">
            <label for="regEmail" class="form-label">
              <span>Email Address</span>
              <span class="required">*</span>
            </label>
            <div class="form-input-wrapper">
              <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              <input type="email" id="regEmail" name="email" class="form-input" placeholder="name@example.com" required
                autocomplete="email">
            </div>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <label for="regPassword" class="form-label">
              <span>Password</span>
              <span class="required">*</span>
            </label>
            <div class="form-input-wrapper">
              <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input type="password" id="regPassword" name="password" class="form-input form-input--has-toggle"
                placeholder="At least 8 characters" required autocomplete="new-password" minlength="8">
              <!-- Toggle Show Password -->
              <button type="button" class="password-toggle" id="toggleRegPasswordBtn"
                aria-label="Toggle password visibility">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Confirm Password Field -->
          <div class="form-group">
            <label for="regConfirmPassword" class="form-label">
              <span>Confirm Password</span>
              <span class="required">*</span>
            </label>
            <div class="form-input-wrapper">
              <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              </svg>
              <input type="password" id="regConfirmPassword" name="confirm_password"
                class="form-input form-input--has-toggle" placeholder="Re-enter your password" required
                autocomplete="new-password" minlength="8">
              <!-- Toggle Show Confirm Password -->
              <button type="button" class="password-toggle" id="toggleRegConfirmPasswordBtn"
                aria-label="Toggle confirm password visibility">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Agreement Checkbox -->
          <div class="form-options">
            <label class="form-checkbox">
              <input type="checkbox" id="agreeTerms" name="terms" required>
              <span>I agree to the <a href="#" class="auth-link auth-link--highlight">Terms of Service</a> and <a
                  href="#" class="auth-link auth-link--highlight">Privacy Policy</a></span>
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn--primary auth-submit-btn">
            <span>Create Account</span>
            <svg class="icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </form>

        <!-- Divider (Chuyển xuống dưới form theo yêu cầu) -->
        <div class="auth-divider" style="margin-top: 26px;">
          <span>or sign up with</span>
        </div>

        <!-- Social Registration Options (Google, Facebook, Apple đặt ở dưới cùng) -->
        <div class="auth-socials">
          <!-- Google -->
          <button type="button" class="auth-social-btn" title="Sign up with Google">
            <svg viewBox="0 0 24 24">
              <path fill="#EA4335"
                d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z" />
              <path fill="#4285F4"
                d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z" />
              <path fill="#FBBC05"
                d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3 0-.8.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15.1s.7 5.4 1.9 7.8l3.7-2.9z" />
              <path fill="#34A853"
                d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16.5C3.7 20.2 7.5 23.5 12 23.5z" />
            </svg>
            <span>Google</span>
          </button>

          <!-- Facebook -->
          <button type="button" class="auth-social-btn" title="Sign up with Facebook">
            <svg viewBox="0 0 24 24" fill="#1877F2">
              <path
                d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
            </svg>
            <span>Facebook</span>
          </button>

          <!-- Apple -->
          <button type="button" class="auth-social-btn" title="Sign up with Apple">
            <svg viewBox="0 0 24 24" fill="#000000">
              <path
                d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-2 .6-2.65 1.36-.58.67-.99 1.74-.86 2.76 1.01.08 2.05-.52 2.59-1.27z" />
            </svg>
            <span>Apple</span>
          </button>
        </div>

        <!-- Prompt to Log In -->
        <div class="auth-footer-prompt">
          Already have an account?
          <a href="./login.html" class="auth-link auth-link--highlight">Log in here</a>
        </div>

      </div>
    </div>
  </main>

  <!-- ========================================================================= -->
  <!-- 3. FOOTER COMPONENT                                                       -->
  <!-- ========================================================================= -->
  <div id="footer-placeholder" data-include="../components/footer.html"></div>


  <!-- Vanilla JS (External relative script) -->
  <script src="../js/main.js"></script>
</body>

</html>
